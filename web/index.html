<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f5" />
    <meta name="description" content="AlphaView 個人選股與策略研究工作台" />
    <title>AlphaView · 選股研究工作台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23006b4f'/%3E%3Ctext x='9' y='30' font-size='28' fill='white'%3EA%3C/text%3E%3C/svg%3E"
    />
    <script>
      ;(() => {
        try {
          const theme = localStorage.getItem('alphaview-theme') === 'dark' ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', theme === 'dark' ? '#0f0f0f' : '#f6f7f5')
          const locale = localStorage.getItem('alphaview-locale') === 'en' ? 'en' : 'zh-TW'
          document.documentElement.lang = locale
          document.documentElement.dataset.locale = locale
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
          document.documentElement.lang = 'zh-TW'
          document.documentElement.dataset.locale = 'zh-TW'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
